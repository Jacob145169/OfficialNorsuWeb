<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NORSU | Administrative Authentication</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c7f76;
            --primary-glow: rgba(44, 127, 118, 0.5);
            --accent: #ff4757;
            --secondary: #2f3542;
            --dark-bg: #0a0b10;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-dim: #a4b0be;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Immersive Dynamic Background */
        .ambient-sphere {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.4;
            animation: float 20s infinite alternate linear;
        }

        .sphere-1 {
            background: linear-gradient(to right, #2c7f76, #1e90ff);
            top: -200px;
            right: -100px;
        }

        .sphere-2 {
            background: linear-gradient(to left, #ff4757, #ffa502);
            bottom: -200px;
            left: -100px;
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 100px) scale(1.1); }
            100% { transform: translate(-50px, -50px) scale(0.9); }
        }

        .main-container {
            width: 100%;
            max-width: 520px;
            padding: 24px;
            position: relative;
            z-index: 10;
            animation: entrance 1s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        @keyframes entrance {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding:60px 40px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 200%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: skewX(-20deg);
            animation: shine 6s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        .header-section {
            margin-bottom: 45px;
        }

        .brand-logo {
            width: 90px;
            height: 90px;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 15px var(--primary-glow));
            animation: pulse 4s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px var(--primary-glow)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 25px var(--primary-glow)); }
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-dim);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 28px;
            text-align: left;
        }

        .label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group i {
            position: absolute;
            left: 20px;
            color: var(--text-dim);
            font-size: 18px;
            transition: 0.3s;
        }

        .form-input {
            width: 100%;
            padding: 18px 20px 18px 55px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .form-input:focus + i {
            color: var(--primary);
        }

        .toggle-pwd {
            position: absolute;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .toggle-pwd:hover {
            color: #fff;
        }

        .action-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary) 0%, #1e90ff 100%);
            color: #fff;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.4s;
            margin-top: 10px;
            box-shadow: 0 10px 30px rgba(44, 127, 118, 0.3);
        }

        .action-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(44, 127, 118, 0.5);
            filter: brightness(1.1);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .alert-box {
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 30px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            backdrop-filter: blur(10px);
            border: 1px solid transparent;
        }

        .alert-err {
            background: rgba(255, 71, 87, 0.1);
            color: #ff4757;
            border-color: rgba(255, 71, 87, 0.2);
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .alert-suc {
            background: rgba(44, 127, 118, 0.1);
            color: var(--primary);
            border-color: rgba(44, 127, 118, 0.2);
        }

        .back-nav {
            position: fixed;
            top: 40px;
            left: 40px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.3s;
            z-index: 100;
        }

        .back-nav:hover {
            color: #fff;
            transform: translateX(-5px);
        }

        .nav-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--glass);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-border);
        }

        .ext-links {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .ext-links a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: 0.3s;
        }

        .ext-links a:hover {
            color: var(--primary);
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 45px 25px;
            }
            .back-nav {
                top: 20px;
                left: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="ambient-sphere sphere-1"></div>
    <div class="ambient-sphere sphere-2"></div>
    
    <a href="/" class="back-nav">
        <div class="nav-circle">
            <i class="fas fa-chevron-left"></i>
        </div>
        <span>Portal Home</span>
    </a>

    <div class="main-container">
        <div class="glass-card">
            <div class="header-section">
                <img src="/static/dashboard/images/logo1.png" alt="NORSU" class="brand-logo">
                <h1 class="title">Negros Oriental State University</h1>
            </div>

            <div id="errorMessage" class="alert-box alert-err">{% for message in messages %}{{ message }}{% endfor %}</div>
            <div id="successMessage" class="alert-box alert-suc"></div>

            <form id="loginForm" method="POST" action="{% url 'super_admin_login' %}">
                {% csrf_token %}

                <div class="form-group">
                    <label class="label">Username</label>
                    <div class="input-group">
                        <i class="fas fa-user-shield"></i>
                        <input type="text" id="username" name="username" class="form-input"
                            placeholder="Account identifier" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label class="label">Security Key</label>
                    <div class="input-group">
                        <i class="fas fa-fingerprint"></i>
                        <input type="password" id="password" name="password" class="form-input"
                            placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-pwd" onclick="togglePassword()">
                            SHOW
                        </button>
                    </div>
                </div>

                <button type="submit" class="action-btn" id="loginBtn">
                    Authenticate
                </button>
            </form>


        </div>
    </div>


    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            const btn = document.getElementById('loginBtn');
            btn.textContent = 'Authenticating...';
            btn.disabled = true;
        });

        function togglePassword() {
            const input = document.getElementById('password');
            const btn = document.querySelector('.toggle-pwd');

            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'HIDE';
            } else {
                input.type = 'password';
                btn.textContent = 'SHOW';
            }
        }

        window.addEventListener('load', function () {
            sessionStorage.removeItem('adminSession');
            localStorage.removeItem('superAdminSession');
            // Auto-show Django error messages if present
            const errBox = document.getElementById('errorMessage');
            if (errBox && errBox.textContent.trim() !== '') {
                errBox.style.display = 'block';
            }
            document.getElementById('username').focus();
        });
    </script>
</body>

</html>
